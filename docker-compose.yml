services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vcoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcoach}
      POSTGRES_DB: vcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcoach -d vcoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://vcoach:${POSTGRES_PASSWORD:-vcoach}@db:5432/vcoach?sslmode=disable
      PORT: ${PORT:-8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GARMIN_API_KEY: ${GARMIN_API_KEY:-}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-60}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_TARGET: http://api:8080
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
