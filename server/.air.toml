# Air live-reload config for the vcoach Go API.
# Install: go install github.com/air-verse/air@latest
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/vcoach ./cmd/server"
entrypoint = "./tmp/vcoach"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "web"]
exclude_regex = ["_test\\.go$"]
delay = 1000
stop_on_root = false
send_interrupt = true
kill_delay = "2s"

[log]
time = true
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
